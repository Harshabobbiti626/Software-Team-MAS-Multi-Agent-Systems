# Global Multi-Agent System (MAS) Configuration

system:
  environment: "development"
  log_level: "INFO"
  deterministic_mode: true
  blackboard_repo_path: "."

limits:
  max_turns_per_agent: 5
  max_total_turns_per_task: 30
  max_prompt_tokens: 128000
  max_candidate_tokens: 16384
  max_thinking_tokens: 65536
  max_consecutive_failures: 3
  circuit_breaker_enabled: true
  task_timeout_seconds: 300

cognition:
  enable_extended_thinking: true
  enable_pre_mortem: true
  enable_tradeoff_matrix: true
  default_thinking_budget: 4096
  high_stakes_thinking_budget: 16384

memory:
  working_memory_window: 10
  compaction_threshold_tokens: 8000
  sqlite_db_path: ".mas_episodic.db"
  enable_semantic_cache: true

models:
  default_model: "gemini-2.5-pro"
  fast_model: "gemini-2.5-flash"
  reasoning_model: "gemini-3.0-thinking"
  roles:
    architect: "gemini-3.0-thinking"
    tech_lead: "gemini-3.0-thinking"
    backend: "gemini-2.5-pro"
    frontend: "gemini-2.5-pro"
    dba: "gemini-3.0-thinking"
    qa: "gemini-2.5-pro"
    sme: "gemini-2.5-pro"
    technical_writer: "gemini-2.5-pro"
    code_reviewer: "gemini-2.5-pro"
    security: "gemini-3.0-thinking"

sandbox:
  default_timeout_seconds: 45
  enforce_isolation: false
  allowed_binaries:
    - "git"
    - "python"
    - "py"
    - "pytest"
    - "ruff"
    - "mypy"
    - "npm"
    - "node"
