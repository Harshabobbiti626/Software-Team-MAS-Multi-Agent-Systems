<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>MAS Mission Control - Multi-Agent Software Engineering Cockpit</title>
  
  <!-- CSS Stylesheets -->
  <link rel="stylesheet" href="/styles.css">
  <link rel="stylesheet" href="/vendor/prism.min.css">
  
  <!-- Typography Fonts -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;500;600&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

  <!-- Core React 18 & Syntax Highlighter Vendor Scripts (Zero External Dependencies) -->
  <script src="/vendor/react.production.min.js"></script>
  <script src="/vendor/react-dom.production.min.js"></script>
  <script src="/vendor/prism.min.js"></script>

  <!-- Client-side Error Guard -->
  <script>
    window.addEventListener('error', function(e) {
      if (!e.error && !e.message) return;
      console.error('MAS Cockpit Runtime Error:', e.error || e.message);
      var root = document.getElementById('root');
      if (root && (root.children.length === 0 || root.innerText.includes('Initializing React 18') || !root.innerHTML.trim())) {
        var errorMsg = e.error && e.error.stack ? e.error.stack : (e.message || 'An unexpected runtime error was caught.');
        root.innerHTML = '<div style="padding: 2.5rem; color: #ef4444; font-family: -apple-system, sans-serif; background: #0b0f17; height: 100vh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center;">' +
          '<div style="font-size: 2.5rem; margin-bottom: 0.5rem;">⚠️</div>' +
          '<h2 style="color: #f9fafb; margin-bottom: 0.5rem;">MAS Cockpit Runtime Resilience Notice</h2>' +
          '<pre style="color: #9ca3af; max-width: 700px; font-size: 0.82rem; margin-bottom: 1.5rem; background: #1f2937; padding: 1rem; border-radius: 8px; text-align: left; overflow: auto; max-height: 200px;">' + errorMsg + '</pre>' +
          '<button onclick="location.reload()" style="padding: 0.5rem 1.25rem; background: #38bdf8; color: #0b0f17; font-weight: 600; border: none; border-radius: 6px; cursor: pointer;">Reload Application</button>' +
          '</div>';
      }
    });
  </script>
</head>
<body class="dark-theme">
  <!-- React 18 Mount Point -->
  <div id="root">
    <!-- Initial server-side fallback state before React mounts -->
    <div style="height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; background: #0b0f17; color: #38bdf8; font-family: 'Inter', sans-serif;">
      <div style="font-size: 1.4rem; font-weight: 700; margin-bottom: 0.5rem; letter-spacing: 0.05em;">MAS MISSION CONTROL</div>
      <div style="font-size: 0.85rem; color: #9ca3af;">Initializing React 18 Autonomous Multi-Agent Cockpit...</div>
    </div>
  </div>

  <!-- React 18 Application Script -->
  <script src="/app.js"></script>
</body>
</html>
