[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "multi-agent-system"
version = "0.1.0"
description = "Enterprise-grade deterministic multi-agent software engineering system"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "MAS Core Team" }
]
dependencies = [
    "pydantic>=2.7.0",
    "PyYAML>=6.0.0",
    "typing-extensions>=4.12.0"
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0"
]

[project.scripts]
mas = "main:main"

[tool.setuptools.packages.find]
include = ["mas*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [
    ".git",
    ".pytest_cache",
    ".agents",
    "artifacts",
    "prompts",
    "templates",
    "mcp",
    "__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "I"]
ignore = ["E501"]
