openapi: 3.0.3
info:
  title: "Integration Test Service Service API"
  version: "1.0.0"
  description: "Canonical contract generated by TechLeadAgent for parallel pod implementation."
paths:
  /api/v1/resource:
    get:
      summary: "Retrieve resource state"
      operationId: "getResource"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ResourceResponse'
        '401':
          description: "Unauthorized"
    post:
      summary: "Create or mutate resource"
      operationId: "createResource"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ResourcePayload'
      responses:
        '201':
          description: "Resource created"
        '422':
          description: "Validation error"
components:
  schemas:
    ResourcePayload:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          example: "Widget-A"
        category:
          type: string
          example: "Enterprise"
    ResourceResponse:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
