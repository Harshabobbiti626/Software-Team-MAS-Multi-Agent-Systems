openapi: 3.0.3
info:
  title: "Real-Time Payment Gateway Service API"
  version: "1.0.0"
  description: "Canonical contract generated by TechLeadAgent for parallel pod implementation."
paths:
  /api/v1/real:
    get:
      summary: "Retrieve real state"
      operationId: "getReal"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RealResponse'
        '401':
          description: "Unauthorized"
    post:
      summary: "Create or mutate real"
      operationId: "createReal"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RealPayload'
      responses:
        '201':
          description: "Resource created"
        '422':
          description: "Validation error"
components:
  schemas:
    RealPayload:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          example: "real-sample"
        category:
          type: string
          example: "Core"
    RealResponse:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
