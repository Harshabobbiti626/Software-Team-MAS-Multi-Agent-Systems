openapi: 3.0.3
info:
  title: "Integration Test Service Service API"
  version: "1.0.0"
  description: "Canonical contract generated by TechLeadAgent for parallel pod implementation."
paths:
  /api/v1/integration:
    get:
      summary: "Retrieve integration state"
      operationId: "getIntegration"
      responses:
        '200':
          description: "Successful response"
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/IntegrationResponse'
        '401':
          description: "Unauthorized"
    post:
      summary: "Create or mutate integration"
      operationId: "createIntegration"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/IntegrationPayload'
      responses:
        '201':
          description: "Resource created"
        '422':
          description: "Validation error"
components:
  schemas:
    IntegrationPayload:
      type: object
      required:
        - name
        - category
      properties:
        name:
          type: string
          example: "integration-sample"
        category:
          type: string
          example: "Core"
    IntegrationResponse:
      type: object
      required:
        - id
        - name
        - status
      properties:
        id:
          type: string
        name:
          type: string
        status:
          type: string
